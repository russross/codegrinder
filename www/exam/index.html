<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeGrinder</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="dist/bundle.js"></script>
</head>
<body>
    <div id="menu-bar">
        <div id="menu-items"></div>
        <button id="vm-boot-button" type="button" hidden>Boot VM</button>
    </div>
    <div id="main-content">
        <div id="file-tree-pane" class="pane"></div>
        <div id="editor-pane" class="pane"></div>
        <div id="info-pane" class="pane">
            <div id="info-tabs">
                <button id="instructions-tab-button" class="tab-button active">Instructions</button>
                <button id="vm-tab-button" class="tab-button" hidden>VM</button>
                <button id="terminal-tab-button" class="tab-button">Grade output</button>
            </div>
            <div id="info-content">
                <div id="instructions-tab-content" class="tab-content active"></div>
                <div id="terminal-tab-content" class="tab-content">
                    <div id="terminal"></div>
                </div>
                <div id="vm-tab-content" class="tab-content">
                    <div id="vm-terminal"></div>
                </div>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="style.css">
</body>
</html>
