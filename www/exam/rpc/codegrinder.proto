}

// Request for GetProblemTypes
message GetProblemTypesRequest {
   string session_cookie = 1;
}

// Response for GetProblemTypes
message GetProblemTypesResponse {
   repeated ProblemType problem_types = 1;
}

// Request for GetProblemType
message GetProblemTypeRequest {
   string session_cookie = 1;
   string name = 2;
