}

// Response for GetCourses
message GetCoursesResponse {
   repeated Course courses = 1;
}

// Request for GetCourse
message GetCourseRequest {
   string session_cookie = 1;
   int64 course_id = 2;
}

// Response for GetCourse
message GetCourseResponse {
   Course course = 1;
}

// Request for GetUsers
message GetUsersRequest {
   string session_cookie = 1;
   string name = 2;
   string email = 3;
