syntax = "proto3";

package codegrinder;

option go_package = "github.com/russross/codegrinder/rpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// User represents a single user as defined by LTI.
message User {
  int64 id = 1;
  string name = 2;
  string email = 3;
  string lti_id = 4;
  string image_url = 5;
  string canvas_login = 6;
  int64 canvas_id = 7;
  bool author = 8;
  bool admin = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp last_signed_in_at = 12;
}

// Course represents a single instance of a course as defined by LTI.
message Course {
  int64 id = 1;
  string name = 2;
  string label = 3;
  string lti_id = 4;
  int64 canvas_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// ScoreList represents a list of scores for a major category
message ScoreList {
  repeated double scores = 1;
}

// Assignment represents a single instance of a problem set for a student in a course.
message Assignment {
  int64 id = 1;
  int64 course_id = 2;
  int64 problem_set_id = 3;
  int64 user_id = 4;
  string roles = 5;
  bool instructor = 6;
  map<string, ScoreList> raw_scores = 7;
  double score = 8;
  string grade_id = 9;
  string lti_id = 10;
  string canvas_title = 11;
  int64 canvas_id = 12;
  string canvas_api_domain = 13;
  string outcome_url = 14;
  string outcome_ext_url = 15;
  string outcome_ext_accepted = 16;
  string finished_url = 17;
  string consumer_key = 18;
  google.protobuf.Timestamp unlock_at = 19;
  google.protobuf.Timestamp due_at = 20;
  google.protobuf.Timestamp lock_at = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
}

// ProblemSet represents a set of problems.
message ProblemSet {
   int64 id = 1;
   string unique = 2;
   string note = 3;
   repeated string tags = 4;
   google.protobuf.Timestamp created_at = 5;
   google.protobuf.Timestamp updated_at = 6;
}

// ProblemType defines one type of problem.
message ProblemType {
   string name = 1;
   string image = 2;
   map<string, bytes> files = 3;
   map<string, ProblemTypeAction> actions = 4;
}

// ProblemTypeAction defines the labels, parser, interactivity, and handler for a
// single problem type action.
message ProblemTypeAction {
   string problem_type = 1;
   string action = 2;
   string command = 3;
   string parser = 4;
   string message = 5;
   bool interactive = 6;
   int64 max_cpu = 7;
   int64 max_session = 8;
   int64 max_timeout = 9;
   int64 max_fd = 10;
   int64 max_file_size = 11;
   int64 max_memory = 12;
   int64 max_threads = 13;
}

// Problem represents a single problem.
message Problem {
   int64 id = 1;
   string unique = 2;
   string note = 3;
   repeated string tags = 4;
   repeated string options = 5;
   google.protobuf.Timestamp created_at = 6;
   google.protobuf.Timestamp updated_at = 7;
}

// ProblemStep represents a single step of a problem.
message ProblemStep {
   int64 problem_id = 1;
   int64 step = 2;
   string problem_type = 3;
   string note = 4;
   string instructions = 5;
   double weight = 6;
   map<string, bytes> files = 7;
   map<string, bool> whitelist = 8;
   map<string, bytes> solution = 9;
}

// ProblemSetProblem represents a problem in a problem set.
message ProblemSetProblem {
   int64 problem_set_id = 1;
   int64 problem_id = 2;
   double weight = 3;
}

// ReportCard gives the results of a graded run
message ReportCard {
   bool passed = 1;
   string note = 2;
   google.protobuf.Duration duration = 3;
   repeated ReportCardResult results = 4;
}

// ReportCardResult Outcomes:
// passed, failed, error, skipped
message ReportCardResult {
   string name = 1;
   string outcome = 2;
   string details = 3;
   string context = 4;
}

// EventMessage follows one of these forms:
// exec ExecCommand, exit ExitStatus, stdin StreamData, stdout StreamData,
// stderr StreamData, stdinclosed, error Error, reportcard ReportCard, files Files
message EventMessage {
   google.protobuf.Timestamp time = 1;
   string event = 2;
   repeated string exec_command = 3;
   int32 exit_status = 4;
   bytes stream_data = 5;
   string error = 6;
   ReportCard report_card = 7;
   map<string, bytes> files = 8;
}

// Commit defines an attempt at solving one step of a Problem.
message Commit {
   int64 id = 1;
   int64 assignment_id = 2;
   int64 problem_id = 3;
   int64 step = 4;
   string action = 5;
   string note = 6;
   map<string, bytes> files = 7;
   repeated EventMessage transcript = 8;
   ReportCard report_card = 9;
   double score = 10;
   google.protobuf.Timestamp created_at = 11;
   google.protobuf.Timestamp updated_at = 12;
}

// ProblemBundle represents a bundle of problem data.
message ProblemBundle {
   map<string, ProblemType> problem_types = 1;
   map<string, string> problem_type_signatures = 2;
   Problem problem = 3;
   repeated ProblemStep problem_steps = 4;
   string problem_signature = 5;
   string hostname = 6;
   int64 user_id = 7;
   repeated Commit commits = 8;
   repeated string commit_signatures = 9;
}

// ProblemSetBundle represents a bundle of problem set data.
message ProblemSetBundle {
   ProblemSet problem_set = 1;
   repeated ProblemSetProblem problem_set_problems = 2;
}

// CommitBundle represents a bundle of commit data.
message CommitBundle {
    ProblemType problem_type = 1;
    string problem_type_signature = 2;
    Problem problem = 3;
    repeated ProblemStep problem_steps = 4;
    string problem_signature = 5;
    string action = 6;
    string hostname = 7;
    int64 user_id = 8;
    Commit commit = 9;
    string commit_signature = 10;
}

// DaycareRequest represents a request for the daycare service.
message DaycareRequest {
    CommitBundle commit_bundle = 1;
    string problem_type = 2;
    string action = 3;
    repeated string args = 4;
}

// DaycareResponse represents a response from the daycare service.
message DaycareResponse {
    oneof response {
        EventMessage event = 1;
        string error = 2;
        CommitBundle commit_bundle = 3;
    }
}

// Version represents version information.
message Version {
   string version = 1;
   string grind_version_required = 2;
   string grind_version_recommended = 3;
   string thonny_version_required = 4;
   string thonny_version_recommended = 5;
}

// CodeGrinderService provides CodeGrinder operations
service CodeGrinderService {
   // ListProblems retrieves all problems and related data for the authenticated user
   rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse);
   // GetVersion retrieves version information
   rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
   // GetProblemTypes retrieves all problem types
   rpc GetProblemTypes(GetProblemTypesRequest) returns (GetProblemTypesResponse);
   // GetProblemType retrieves a specific problem type
   rpc GetProblemType(GetProblemTypeRequest) returns (GetProblemTypeResponse);
   // GetProblems retrieves problems with optional filters
   rpc GetProblems(GetProblemsRequest) returns (GetProblemsResponse);
   // GetProblem retrieves a specific problem
   rpc GetProblem(GetProblemRequest) returns (GetProblemResponse);
   // GetProblemSteps retrieves steps for a problem
   rpc GetProblemSteps(GetProblemStepsRequest) returns (GetProblemStepsResponse);
   // GetProblemStep retrieves a specific step
   rpc GetProblemStep(GetProblemStepRequest) returns (GetProblemStepResponse);
   // GetProblemSets retrieves problem sets with optional filters
   rpc GetProblemSets(GetProblemSetsRequest) returns (GetProblemSetsResponse);
   // GetProblemSet retrieves a specific problem set
   rpc GetProblemSet(GetProblemSetRequest) returns (GetProblemSetResponse);
   // GetProblemSetProblems retrieves problems in a problem set
   rpc GetProblemSetProblems(GetProblemSetProblemsRequest) returns (GetProblemSetProblemsResponse);
   // GetCourses retrieves courses with optional filters
   rpc GetCourses(GetCoursesRequest) returns (GetCoursesResponse);
   // GetCourse retrieves a specific course
   rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
   // GetUsers retrieves users with optional filters
   rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
   // GetUserMe retrieves the current user
   rpc GetUserMe(GetUserMeRequest) returns (GetUserMeResponse);
   // GetUser retrieves a specific user
   rpc GetUser(GetUserRequest) returns (GetUserResponse);
   // GetCourseUsers retrieves users in a course
   rpc GetCourseUsers(GetCourseUsersRequest) returns (GetCourseUsersResponse);
   // GetUserAssignments retrieves assignments for a user
   rpc GetUserAssignments(GetUserAssignmentsRequest) returns (GetUserAssignmentsResponse);
   // GetCourseUserAssignments retrieves assignments for a user in a course
   rpc GetCourseUserAssignments(GetCourseUserAssignmentsRequest) returns (GetCourseUserAssignmentsResponse);
   // GetAssignments retrieves assignments with optional filters
   rpc GetAssignments(GetAssignmentsRequest) returns (GetAssignmentsResponse);
   // GetAssignment retrieves a specific assignment
   rpc GetAssignment(GetAssignmentRequest) returns (GetAssignmentResponse);
   // GetAssignmentProblemCommitLast retrieves the last commit for a problem in an assignment
   rpc GetAssignmentProblemCommitLast(GetAssignmentProblemCommitLastRequest) returns (GetAssignmentProblemCommitLastResponse);
   // GetAssignmentProblemStepCommitLast retrieves the last commit for a step in an assignment
   rpc GetAssignmentProblemStepCommitLast(GetAssignmentProblemStepCommitLastRequest) returns (GetAssignmentProblemStepCommitLastResponse);
   // PostProblemBundleUnconfirmed handles unconfirmed problem bundle
   rpc PostProblemBundleUnconfirmed(PostProblemBundleUnconfirmedRequest) returns (PostProblemBundleUnconfirmedResponse);
   // PostProblemBundleConfirmed handles confirmed problem bundle
   rpc PostProblemBundleConfirmed(PostProblemBundleConfirmedRequest) returns (PostProblemBundleConfirmedResponse);
   // PutProblemBundle handles updating problem bundle
   rpc PutProblemBundle(PutProblemBundleRequest) returns (PutProblemBundleResponse);
   // PostProblemSetBundle handles problem set bundle
   rpc PostProblemSetBundle(PostProblemSetBundleRequest) returns (PostProblemSetBundleResponse);
   // PutProblemSetBundle handles updating problem set bundle
   rpc PutProblemSetBundle(PutProblemSetBundleRequest) returns (PutProblemSetBundleResponse);
   // PostCommitBundlesUnsigned handles unsigned commit bundle
   rpc PostCommitBundlesUnsigned(PostCommitBundlesUnsignedRequest) returns (PostCommitBundlesUnsignedResponse);
    // PostCommitBundlesSigned handles signed commit bundle
    rpc PostCommitBundlesSigned(PostCommitBundlesSignedRequest) returns (PostCommitBundlesSignedResponse);
    // Daycare handles streaming daycare requests
    rpc Daycare(DaycareRequest) returns (stream DaycareResponse);
}

// Request for ListProblems
message ListProblemsRequest {
  string session_cookie = 1;
}

// Response for ListProblems
message ListProblemsResponse {
   User user = 1;
   repeated Assignment assignments = 2;
   repeated Course courses = 3;
   repeated ProblemSet problem_sets = 4;
}

// Request for GetVersion
message GetVersionRequest {
}

// Response for GetVersion
message GetVersionResponse {
