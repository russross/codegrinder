   string admin = 5;
}

// Response for GetUsers
message GetUsersResponse {
   repeated User users = 1;
}

// Request for GetUserMe
message GetUserMeRequest {
   string session_cookie = 1;
}

// Response for GetUserMe
message GetUserMeResponse {
   User user = 1;
}

// Request for GetUser
message GetUserRequest {
   string session_cookie = 1;
   int64 user_id = 2;
}

// Response for GetUser
message GetUserResponse {
