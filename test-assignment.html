<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Assignment Loader</title>
  <script>
    // Sample student assignment structure
    const assignment = {
      children: {
        // Instructions
        "doc": {
          children: {
            "index.html": {
              content: "<h1>Assignment: Calculator Functions</h1>\n" +
"<p>Implement the following functions in <code>calculator.js</code>:</p>\n" +
"<ol>\n" +
"  <li><code>add(a, b)</code> - Returns the sum of two numbers</li>\n" +
"  <li><code>subtract(a, b)</code> - Returns the difference</li>\n" +
"  <li><code>multiply(a, b)</code> - Returns the product</li>\n" +
"  <li><code>divide(a, b)</code> - Returns the quotient</li>\n" +
"</ol>\n" +
"<p>Run the tests using <code>test.js</code> to verify your solution.</p>"
            }
          }
        },
        // Student's solution file (starter code)
        "calculator.js": {
          content: "// Implement your calculator functions here\n\n" +
"function add(a, b) {\n" +
"    // TODO: implement addition\n" +
"    return 0;\n" +
"}\n\n" +
"function subtract(a, b) {\n" +
"    // TODO: implement subtraction\n" +
"    return 0;\n" +
"}\n\n" +
"function multiply(a, b) {\n" +
"    // TODO: implement multiplication\n" +
"    return 0;\n" +
"}\n\n" +
"function divide(a, b) {\n" +
"    // TODO: implement division\n" +
"    return 0;\n" +
"}\n\n" +
"// Export functions for testing\n" +
"module.exports = { add, subtract, multiply, divide };"
        },
        // Test file
        "test.js": {
          content: "// Load the calculator module\n" +
"const calc = require('./calculator.js');\n\n" +
"console.log('Running Calculator Tests...');\n" +
"console.log('================================\\n');\n\n" +
"// Test add\n" +
"console.log('Testing add():');\n" +
"const addResult = calc.add(5, 3);\n" +
"console.log('  add(5, 3) = ' + addResult);\n" +
"console.log('  Expected: 8');\n" +
"console.log('  Pass: ' + (addResult === 8) + '\\n');\n\n" +
"// Test subtract\n" +
"console.log('Testing subtract():');\n" +
"const subResult = calc.subtract(10, 4);\n" +
"console.log('  subtract(10, 4) = ' + subResult);\n" +
"console.log('  Expected: 6');\n" +
"console.log('  Pass: ' + (subResult === 6) + '\\n');\n\n" +
"// Test multiply\n" +
"console.log('Testing multiply():');\n" +
"const mulResult = calc.multiply(6, 7);\n" +
"console.log('  multiply(6, 7) = ' + mulResult);\n" +
"console.log('  Expected: 42');\n" +
"console.log('  Pass: ' + (mulResult === 42) + '\\n');\n\n" +
"// Test divide\n" +
"console.log('Testing divide():');\n" +
"const divResult = calc.divide(15, 3);\n" +
"console.log('  divide(15, 3) = ' + divResult);\n" +
"console.log('  Expected: 5');\n" +
"console.log('  Pass: ' + (divResult === 5) + '\\n');\n\n" +
"console.log('================================');\n" +
"console.log('Tests complete!');"
        },
        // Solution (hidden from students in real scenario)
        "solution.js": {
          content: "// Complete solution for reference\n\n" +
"function add(a, b) {\n" +
"    return a + b;\n" +
"}\n\n" +
"function subtract(a, b) {\n" +
"    return a - b;\n" +
"}\n\n" +
"function multiply(a, b) {\n" +
"    return a * b;\n" +
"}\n\n" +
"function divide(a, b) {\n" +
"    if (b === 0) {\n" +
"        throw new Error('Division by zero');\n" +
"    }\n" +
"    return a / b;\n" +
"}\n\n" +
"module.exports = { add, subtract, multiply, divide };"
        }
      }
    };

    // Redirect to index.html with the assignment loaded
    const filesParam = encodeURIComponent(JSON.stringify(assignment));
    window.location.href = "index.html?dummy=true&files=" + filesParam;
  </script>
</head>

</html>
