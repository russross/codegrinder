[project]
name = "cli"
version = "0.1.0"
description = "Python CLI for CodeGrinder"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.78.0",
    "protobuf>=6.33.5",
    "packaging>=25.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.78.0",
    "pytest>=9.0.0",
    "ty>=0.0.1a17",
]

[project.scripts]
grind = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ty.environment]
root = ["."]
