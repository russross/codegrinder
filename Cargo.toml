[workspace]
members = ["server", "grind"]
resolver = "3"

[workspace.package]
version = "2.8.0"
edition = "2024"

[workspace.dependencies]
axum = "=0.8.7"
axum-server = "=0.8.0"
base64 = "=0.22.1"
bytes = "=1.11.0"
chrono = { version = "=0.4.42", default-features = false }
clap = "=4.6.1"
flate2 = "=1.1.5"
hex = "=0.4.3"
hmac = "=0.12.1"
http = "=1.3.1"
ignore = "=0.4.25"
prost = "=0.14.1"
prost-types = "=0.14.1"
rand = "=0.9.2"
reqwest = { version = "=0.12.24", default-features = false }
roxmltree = "=0.21.1"
rusqlite = "=0.37.0"
semver = "=1.0.27"
serde = "=1.0.228"
serde_json = "=1.0.145"
sha1 = "=0.10.6"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
tar = "=0.4.44"
thiserror = "=2.0.17"
tokio = "=1.48.0"
tokio-stream = "=0.1.17"
toml = "=0.9.8"
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = "=0.14.2"
tonic-prost-build = "=0.14.2"
tonic-web = "=0.14.6"
tower = "=0.5.2"
tower-http = "=0.6.6"
url = "=2.5.7"
urlencoding = "=2.1.3"
