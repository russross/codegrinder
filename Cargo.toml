[workspace]
members = ["server", "grind"]
resolver = "3"

[workspace.package]
version = "3.0.0"
edition = "2024"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[workspace.dependencies]
axum = "=0.8.9"
base64 = "=0.23.1"
bytes = "=1.12.1"
chrono = { version = "=0.4.45", default-features = false }
clap = "=4.6.6"
flate2 = "=1.1.9"
hex = "=0.4.3"
hmac = "=0.13.0"
http = "=1.5.0"
ignore = "=0.4.33"
prost = "=0.14.4"
prost-types = "=0.14.4"
rand = "=0.10.2"
reqwest = { version = "=0.13.4", default-features = false }
roxmltree = "=0.21.1"
rusqlite = "=0.40.2"
semver = "=1.0.28"
serde = "=1.0.229"
serde_json = "=1.0.151"
sha1 = "=0.11.0"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
tar = "=0.4.46"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tokio-stream = "=0.1.19"
toml = "=1.1.4"
tonic = { version = "=0.14.6", default-features = false }
tonic-prost = "=0.14.6"
tonic-prost-build = "=0.14.6"
tonic-web = "=0.14.6"
tower = "=0.5.3"
tower-http = "=0.7.0"
url = "=2.5.8"
urlencoding = "=2.1.3"
