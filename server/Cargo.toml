[package]
name = "codegrinder"
version.workspace = true
edition.workspace = true

[dependencies]
axum = { workspace = true, features = ["http2", "tokio", "json"] }
base64.workspace = true
chrono = { workspace = true, features = ["clock", "serde", "std"] }
flate2.workspace = true
form_urlencoded.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
ignore.workspace = true
prost.workspace = true
prost-types.workspace = true
rand.workspace = true
roxmltree.workspace = true
rusqlite = { workspace = true, features = ["bundled", "hooks"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
tokio-stream.workspace = true
tonic = { workspace = true, features = ["codegen", "gzip"] }
tonic-prost.workspace = true
tonic-web.workspace = true
tower.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
