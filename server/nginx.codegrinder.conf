# /etc/nginx/http.d/codegrinder.conf
#
# Default hostname in this template is mud.russross.com.
# This file assumes server is listening on 127.0.0.1:8080 (h2c gRPC).
# LTI HTTP endpoints are expected on 127.0.0.1:8081.

upstream codegrinder_server_grpc {
    server 127.0.0.1:8080;
    keepalive 64;
}

upstream codegrinder_server_http {
    server 127.0.0.1:8081;
    keepalive 32;
}

# Reflect Origin for browser grpc-web clients (TA host -> daycare host allowed).
map $http_origin $codegrinder_cors_origin {
    default $http_origin;
    "" "*";
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mud.russross.com;

    ssl_certificate /home/russ/codegrinder/certs/letsencrypt/live/mud.russross.com/fullchain.pem;
    ssl_certificate_key /home/russ/codegrinder/certs/letsencrypt/live/mud.russross.com/privkey.pem;
    ssl_protocols TLSv1.3;

    # Response compression for HTTP clients that advertise support.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/plain text/css application/xml text/xml;

    # Decompress upstream gzip responses when needed (for clients that do not support gzip).
    gunzip on;

    # gRPC endpoint (TLS terminated here, cleartext h2c to local server).
    location /codegrinder.CodeGrinderService/ {
        # grpc-web CORS preflight.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $codegrinder_cors_origin always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "content-type,x-grpc-web,x-user-agent,grpc-timeout,authorization,accept,x-accept-response-streaming,x-accept-content-transfer-encoding" always;
            add_header Access-Control-Expose-Headers "grpc-status,grpc-message,grpc-status-details-bin" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type text/plain always;
            add_header Content-Length 0 always;
            return 204;
        }

        # grpc-web CORS response headers.
        add_header Access-Control-Allow-Origin $codegrinder_cors_origin always;
        add_header Access-Control-Expose-Headers "grpc-status,grpc-message,grpc-status-details-bin" always;
        add_header Vary Origin always;

        # Normalize grpc-web browser requests for the local gRPC upstream.
        grpc_set_header Content-Type application/grpc;
        grpc_set_header TE trailers;
        grpc_pass grpc://codegrinder_server_grpc;
        grpc_read_timeout 3600s;
        grpc_send_timeout 3600s;
        grpc_socket_keepalive on;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;

        # Allow gRPC message compression negotiation (end-to-end).
        grpc_set_header grpc-accept-encoding "identity,gzip";

        # Pass back gRPC status headers for browser clients.
        grpc_pass_header grpc-status;
        grpc_pass_header grpc-message;
        grpc_pass_header grpc-status-details-bin;
    }

    # LTI endpoints.
    location /lti/ {
        proxy_pass http://codegrinder_server_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /daycare_registrations {
        proxy_pass http://codegrinder_server_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /version {
        proxy_pass http://codegrinder_server_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /v2/version {
        proxy_pass http://codegrinder_server_http;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Static files (Go server equivalent): serve from $CODEGRINDERROOT/www
    # and resolve directory requests to index.html.
    location / {
        root /home/russ/codegrinder/www;
        try_files $uri $uri/index.html =404;
    }
}
