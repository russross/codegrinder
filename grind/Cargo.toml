[package]
name = "grind"
version = "2.8.0"
edition = "2024"

[dependencies]
bytes = "1.11.0"
clap = { version = "4.6.1", features = ["derive"] }
http = "1.3.1"
ignore = "0.4.25"
prost = "0.14.1"
prost-types = "0.14.1"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "process"] }
toml = "0.9.8"
tonic = { version = "0.14.6", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-webpki-roots", "gzip"] }
tonic-prost = "0.14.2"

[build-dependencies]
tonic-prost-build = "0.14.2"
