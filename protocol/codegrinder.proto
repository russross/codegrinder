syntax = "proto3";

package codegrinder;

option go_package = "github.com/russross/codegrinder/protocol";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

// User represents a single user as defined by LTI.
message User {
  string user_id = 1;
  string user_name = 2;
  string user_login = 3;
  bool author = 4;
}

// Course represents a single instance of a course as defined by LTI.
message Course {
  string course_id = 1;
  string course_name = 2;
}

// AssignmentKey is the natural key for one assignment.
message AssignmentKey {
  string user_id = 1;
  string course_id = 2;
  string problem_set_id = 3;
}

// Assignment represents a single instance of a problem set for a student in a course.
message Assignment {
  string user_id = 1;
  string course_id = 2;
  string problem_set_id = 3;
  bool restricted = 4;
  string grade_id = 5;
  string outcome_url = 6;
  string outcome_ext_accepted = 7;
  string consumer_key = 8;
  google.protobuf.Timestamp unlock_at = 9;
  google.protobuf.Timestamp due_at = 10;
  google.protobuf.Timestamp lock_at = 11;
}

// ProblemSet represents a set of problems.
message ProblemSet {
   string problem_set_id = 1;
   string problem_set_note = 2;
   repeated string problem_set_tags = 3;
   google.protobuf.Timestamp created_at = 4;
   google.protobuf.Timestamp updated_at = 5;
}

// ProblemType defines one type of problem.
message ProblemType {
   string problem_type = 1;
   string container = 2;
   map<string, bytes> files = 3;
   map<string, ProblemTypeAction> actions = 4;
}

// ProblemTypeAction defines parser/command and execution limits for a
// single problem type action.
message ProblemTypeAction {
   string problem_type = 1;
   string action = 2;
   string command = 3;
   string parser = 4;
   int64 max_cpu = 7;
   int64 max_fd = 10;
   int64 max_file_size = 11;
   int64 max_memory = 12;
   int64 max_threads = 13;
   reserved 5, 6, 8, 9;
   reserved "message", "interactive", "max_session", "max_timeout";
}

// Problem represents a single problem.
message Problem {
   string problem_id = 1;
   string problem_note = 2;
   repeated string problem_tags = 3;
   repeated string problem_options = 4;
   google.protobuf.Timestamp created_at = 5;
   google.protobuf.Timestamp updated_at = 6;
}

// ProblemStep represents a single step of a problem.
message ProblemStep {
   string problem_id = 1;
   int64 step = 2;
   string problem_type = 3;
   string note = 4;
   string instructions = 5;
   double weight = 6;
   map<string, bytes> files = 7;
   map<string, bool> whitelist = 8;
   map<string, bytes> solution = 9;
}

// ProblemSetProblem represents a problem in a problem set.
message ProblemSetProblem {
   string problem_set_id = 1;
   string problem_id = 2;
   double weight = 3;
}

// ReportCard gives the results of a graded run
message ReportCard {
   bool passed = 1;
   string note = 2;
   google.protobuf.Duration duration = 3;
   repeated ReportCardResult results = 4;
}

// ReportCardResult Outcomes:
// passed, failed, error, skipped
message ReportCardResult {
   string name = 1;
   string outcome = 2;
   string details = 3;
   string context = 4;
}

// EventMessage follows one of these forms:
// exec ExecCommand, exit ExitStatus, stdin StreamData, stdout StreamData,
// stderr StreamData, stdinclosed, error Error, reportcard ReportCard, files Files
message EventMessage {
   google.protobuf.Timestamp time = 1;
   string event = 2;
   repeated string exec_command = 3;
   int32 exit_status = 4;
   bytes stream_data = 5;
   string error = 6;
   ReportCard report_card = 7;
   map<string, bytes> files = 8;
}

// Commit defines an attempt at solving one step of a Problem.
message Commit {
   int64 id = 1;
   AssignmentKey assignment = 2;
   string problem_id = 3;
   int64 step = 4;
   string action = 5;
   string note = 6;
   map<string, bytes> files = 7;
   repeated EventMessage transcript = 8;
   ReportCard report_card = 9;
   double score = 10;
   google.protobuf.Timestamp created_at = 11;
   google.protobuf.Timestamp updated_at = 12;
}

// ProblemBundle represents a bundle of problem data.
message ProblemBundle {
   map<string, ProblemType> problem_types = 1;
   map<string, string> problem_type_signatures = 2;
   Problem problem = 3;
   repeated ProblemStep problem_steps = 4;
   string problem_signature = 5;
   string hostname = 6;
   string user_id = 7;
   repeated Commit commits = 8;
   repeated string commit_signatures = 9;
   repeated SignedGradingCommit signed_grading_commits = 10;
}

// ProblemSetBundle represents a bundle of problem set data.
message ProblemSetBundle {
   ProblemSet problem_set = 1;
   repeated ProblemSetProblem problem_set_problems = 2;
}

// GradingCommit represents one commit together with the grading context daycare needs.
message GradingCommit {
    ProblemType problem_type = 1;
    Problem problem = 2;
    repeated ProblemStep problem_steps = 3;
    string hostname = 4;
    string user_id = 5;
    Commit commit = 6;
}

// SignedGradingCommit carries an encoded grading commit plus its signature.
message SignedGradingCommit {
    bytes commit = 1;
    string signature = 2;
}

// DaycareRequest represents a request for the daycare service.
message DaycareRequest {
    SignedGradingCommit commit = 1;
    string problem_type = 2;
    string action = 3;
    repeated string args = 4;
}

// DaycareResponse represents a response from the daycare service.
message DaycareResponse {
    oneof response {
        EventMessage event = 1;
        string error = 2;
        SignedGradingCommit commit = 3;
    }
}

// Version represents version information.
message Version {
   string version = 1;
   string grind_version_required = 2;
   string grind_version_recommended = 3;
   string thonny_version_required = 4;
   string thonny_version_recommended = 5;
}

// CodeGrinderService provides CodeGrinder operations
service CodeGrinderService {
   // Hello performs session validation/exchange and returns server info
   rpc Hello(HelloRequest) returns (HelloResponse);
   // ListProblems retrieves all problems and related data for the authenticated user
   rpc ListProblems(ListProblemsRequest) returns (ListProblemsResponse);
   // ListAssignments retrieves assignment-focused list rows for list/student flows.
   rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
   // SearchProblemCatalog retrieves problem sets with nested problem and step summaries.
   rpc SearchProblemCatalog(SearchProblemCatalogRequest) returns (SearchProblemCatalogResponse);
   // GetProblemTypes retrieves all problem types
   rpc GetProblemTypes(GetProblemTypesRequest) returns (GetProblemTypesResponse);
   // GetProblemType retrieves a specific problem type
   rpc GetProblemType(GetProblemTypeRequest) returns (GetProblemTypeResponse);
   // GetProblems retrieves problems with optional filters
   rpc GetProblems(GetProblemsRequest) returns (GetProblemsResponse);
   // GetProblem retrieves a specific problem
   rpc GetProblem(GetProblemRequest) returns (GetProblemResponse);
   // GetProblemSteps retrieves steps for a problem
   rpc GetProblemSteps(GetProblemStepsRequest) returns (GetProblemStepsResponse);
   // GetProblemStep retrieves a specific step
   rpc GetProblemStep(GetProblemStepRequest) returns (GetProblemStepResponse);
   // GetProblemSets retrieves problem sets with optional filters
   rpc GetProblemSets(GetProblemSetsRequest) returns (GetProblemSetsResponse);
   // GetProblemSetProblems retrieves problems in a problem set
   rpc GetProblemSetProblems(GetProblemSetProblemsRequest) returns (GetProblemSetProblemsResponse);
   // GetCourse retrieves a specific course
   rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
   // GetUser retrieves a specific user
   rpc GetUser(GetUserRequest) returns (GetUserResponse);
   // GetAssignments retrieves assignments with optional filters
   rpc GetAssignments(GetAssignmentsRequest) returns (GetAssignmentsResponse);
   // GetAssignment retrieves a specific assignment
   rpc GetAssignment(GetAssignmentRequest) returns (GetAssignmentResponse);
   // GetAssignmentInfo retrieves assignment metadata and per-problem step progress.
   rpc GetAssignmentInfo(GetAssignmentInfoRequest) returns (GetAssignmentInfoResponse);
   // GetProblemStepFiles retrieves system-owned and student-owned files for one step.
   rpc GetProblemStepFiles(GetProblemStepFilesRequest) returns (GetProblemStepFilesResponse);
   // PostProblemBundleUnconfirmed handles unconfirmed problem bundle
   rpc PostProblemBundleUnconfirmed(PostProblemBundleUnconfirmedRequest) returns (PostProblemBundleUnconfirmedResponse);
   // PostProblemBundleConfirmed handles confirmed problem bundle
   rpc PostProblemBundleConfirmed(PostProblemBundleConfirmedRequest) returns (PostProblemBundleConfirmedResponse);
   // PutProblemBundle handles updating problem bundle
   rpc PutProblemBundle(PutProblemBundleRequest) returns (PutProblemBundleResponse);
   // PostProblemSetBundle handles problem set bundle
   rpc PostProblemSetBundle(PostProblemSetBundleRequest) returns (PostProblemSetBundleResponse);
   // PutProblemSetBundle handles updating problem set bundle
   rpc PutProblemSetBundle(PutProblemSetBundleRequest) returns (PutProblemSetBundleResponse);
   // SaveUngradedCommit handles an ungraded commit before daycare processing.
   rpc SaveUngradedCommit(SaveUngradedCommitRequest) returns (SaveUngradedCommitResponse);
   // SaveGradedCommit handles a graded commit returned by daycare.
   rpc SaveGradedCommit(SaveGradedCommitRequest) returns (SaveGradedCommitResponse);
   // Daycare handles streaming daycare requests
   rpc Daycare(DaycareRequest) returns (stream DaycareResponse);
}

// Request for Hello
message HelloRequest {
   string key = 1;
}

// Response for Hello
message HelloResponse {
   string cookie = 1;
   User user = 2;
   Version version = 3;
}

// Request for ListProblems
message ListProblemsRequest {
  string session_cookie = 1;
}

// Response for ListProblems
message ListProblemsResponse {
   User user = 1;
   repeated Assignment assignments = 2;
   repeated Course courses = 3;
   repeated ProblemSet problem_sets = 4;
}

// Request for ListAssignments
message ListAssignmentsRequest {
  string session_cookie = 1;
  repeated string search = 2;
  bool include_student_context = 3;
}

// AssignmentListItem returns assignment list data shaped for list/student commands.
message AssignmentListItem {
  AssignmentKey assignment = 1;
  string problem_set_note = 2;
  google.protobuf.Timestamp unlock_at = 3;
  google.protobuf.Timestamp due_at = 4;
  google.protobuf.Timestamp lock_at = 5;
  string course_name = 6;
  string user_name = 7;
  string user_login = 8;
}

// Response for ListAssignments
message ListAssignmentsResponse {
  repeated AssignmentListItem items = 1;
}

// Request for SearchProblemCatalog
message SearchProblemCatalogRequest {
  string session_cookie = 1;
  repeated string search = 2;
}

// ProblemCatalogStep summarizes one step for catalog display.
message ProblemCatalogStep {
  int64 step_number = 1;
  string step_note = 2;
  int64 step_weight = 3;
}

// ProblemCatalogProblem summarizes one problem and its steps for a problem set.
message ProblemCatalogProblem {
  string problem_id = 1;
  string problem_note = 2;
  int64 problem_weight = 3;
  repeated ProblemCatalogStep steps = 4;
}

// ProblemCatalogSet summarizes one problem set for search results.
message ProblemCatalogSet {
  string problem_set_id = 1;
  string problem_set_note = 2;
  repeated string problem_set_tags = 3;
  repeated ProblemCatalogProblem problems = 4;
}

// Response for SearchProblemCatalog
message SearchProblemCatalogResponse {
  repeated ProblemCatalogSet problem_sets = 1;
}

// Request for GetProblemTypes
message GetProblemTypesRequest {
   string session_cookie = 1;
}

// Response for GetProblemTypes
message GetProblemTypesResponse {
   repeated ProblemType problem_types = 1;
}

// Request for GetProblemType
message GetProblemTypeRequest {
   string session_cookie = 1;
   string problem_type = 2;
}

// Response for GetProblemType
message GetProblemTypeResponse {
   ProblemType problem_type = 1;
}

// Request for GetProblems
message GetProblemsRequest {
   string session_cookie = 1;
   string unique = 2;
   string problem_type = 3;
   string note = 4;
}

// Response for GetProblems
message GetProblemsResponse {
   repeated Problem problems = 1;
}

// Request for GetProblem
message GetProblemRequest {
   string session_cookie = 1;
   string problem_id = 2;
}

// Response for GetProblem
message GetProblemResponse {
   Problem problem = 1;
}

// Request for GetProblemSteps
message GetProblemStepsRequest {
   string session_cookie = 1;
   string problem_id = 2;
}

// Response for GetProblemSteps
message GetProblemStepsResponse {
   repeated ProblemStep problem_steps = 1;
}

// Request for GetProblemStep
message GetProblemStepRequest {
   string session_cookie = 1;
   string problem_id = 2;
   int64 step = 3;
}

// Response for GetProblemStep
message GetProblemStepResponse {
   ProblemStep problem_step = 1;
}

// Request for GetProblemSets
message GetProblemSetsRequest {
   string session_cookie = 1;
   string unique = 2;
   string note = 3;
   repeated string search = 4;
}

// Response for GetProblemSets
message GetProblemSetsResponse {
   repeated ProblemSet problem_sets = 1;
}

// Request for GetProblemSetProblems
message GetProblemSetProblemsRequest {
   string session_cookie = 1;
   string problem_set_id = 2;
}

// Response for GetProblemSetProblems
message GetProblemSetProblemsResponse {
   repeated ProblemSetProblem problem_set_problems = 1;
}

// Request for GetCourse
message GetCourseRequest {
   string session_cookie = 1;
   string course_id = 2;
}

// Response for GetCourse
message GetCourseResponse {
   Course course = 1;
}

// Request for GetUser
message GetUserRequest {
   string session_cookie = 1;
   string user_id = 2;
}

// Response for GetUser
message GetUserResponse {
   User user = 1;
}

// Request for GetAssignments
message GetAssignmentsRequest {
   string session_cookie = 1;
   repeated string search = 2;
}

// Response for GetAssignments
message GetAssignmentsResponse {
   repeated Assignment assignments = 1;
}

// Request for GetAssignment
message GetAssignmentRequest {
   string session_cookie = 1;
   AssignmentKey assignment = 2;
}

// Response for GetAssignment
message GetAssignmentResponse {
   Assignment assignment = 1;
}

// Request for GetAssignmentInfo
message GetAssignmentInfoRequest {
   string session_cookie = 1;
   AssignmentKey assignment = 2;
}

// AssignmentProblemInfo reports one problem's progress in the assignment.
message AssignmentProblemInfo {
   string problem_id = 1;
   string problem_note = 2;
   int64 current_step_number = 3;
   int64 total_steps = 4;
}

// Response for GetAssignmentInfo
message GetAssignmentInfoResponse {
   AssignmentKey assignment = 1;
   string problem_set_note = 2;
   string course_name = 3;
   repeated AssignmentProblemInfo problems = 4;
}

// Request for GetProblemStepFiles
message GetProblemStepFilesRequest {
   string session_cookie = 1;
   AssignmentKey assignment = 2;
   string problem_id = 3;
   int64 step_number = 4; // 0 means use the student's current step for this problem.
   bool reset_to_step_start = 5;
}

// ProblemStepFileBlob is one file path/content pair.
message ProblemStepFileBlob {
   string path = 1;
   bytes content = 2;
}

// Response for GetProblemStepFiles
message GetProblemStepFilesResponse {
   int64 step_number = 1;
   int64 total_steps = 2;
   repeated ProblemStepFileBlob system_owned_files = 3;
   repeated ProblemStepFileBlob student_owned_files = 4;
}

// Request for PostProblemBundleUnconfirmed
message PostProblemBundleUnconfirmedRequest {
   string session_cookie = 1;
   ProblemBundle bundle = 2;
}

// Response for PostProblemBundleUnconfirmed
message PostProblemBundleUnconfirmedResponse {
   ProblemBundle bundle = 1;
}

// Request for PostProblemBundleConfirmed
message PostProblemBundleConfirmedRequest {
   string session_cookie = 1;
   ProblemBundle bundle = 2;
}

// Response for PostProblemBundleConfirmed
message PostProblemBundleConfirmedResponse {
   ProblemBundle bundle = 1;
}

// Request for PutProblemBundle
message PutProblemBundleRequest {
   string session_cookie = 1;
   string problem_id = 2;
   ProblemBundle bundle = 3;
}

// Response for PutProblemBundle
message PutProblemBundleResponse {
   ProblemBundle bundle = 1;
}

// Request for PostProblemSetBundle
message PostProblemSetBundleRequest {
   string session_cookie = 1;
   ProblemSetBundle bundle = 2;
}

// Response for PostProblemSetBundle
message PostProblemSetBundleResponse {
   ProblemSetBundle bundle = 1;
}

// Request for PutProblemSetBundle
message PutProblemSetBundleRequest {
   string session_cookie = 1;
   ProblemSetBundle bundle = 2;
}

// Response for PutProblemSetBundle
message PutProblemSetBundleResponse {
   ProblemSetBundle bundle = 1;
}

// Request for SaveUngradedCommit
message SaveUngradedCommitRequest {
   string session_cookie = 1;
   GradingCommit commit = 2;
}

// Response for SaveUngradedCommit
message SaveUngradedCommitResponse {
   SignedGradingCommit commit = 1;
}

// Request for SaveGradedCommit
message SaveGradedCommitRequest {
   string session_cookie = 1;
   SignedGradingCommit commit = 2;
}

// Response for SaveGradedCommit
message SaveGradedCommitResponse {
   SignedGradingCommit commit = 1;
}
