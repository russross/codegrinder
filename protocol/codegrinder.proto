syntax = "proto3";

package codegrinder;

option go_package = "github.com/russross/codegrinder/protocol";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// Version represents version information.
message Version {
  string version = 1;
  string grind_version_required = 2;
  string grind_version_recommended = 3;
  string thonny_version_required = 4;
  string thonny_version_recommended = 5;
}

// AssignmentKey is the natural key for one assignment.
message AssignmentKey {
  string user_id = 1;
  string course_id = 2;
  string problem_set_id = 3;
}

// ProblemSet represents a set of problems.
message ProblemSet {
  string problem_set_id = 1;
  string problem_set_note = 2;
  repeated string problem_set_tags = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string continues_problem_set_id = 6;
}

// Problem represents a single problem.
message Problem {
  string problem_id = 1;
  string problem_note = 2;
  repeated string problem_tags = 3;
  repeated string problem_options = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ProblemStep represents a single step of a problem.
message ProblemStep {
  string problem_id = 1;
  int64 step = 2;
  string problem_type = 3;
  string note = 4;
  double weight = 5;
  map<string, bytes> files = 6;
  map<string, bool> whitelist = 7;
  map<string, bytes> starter_files = 8;
}

// ProblemSetProblem represents a problem in a problem set.
message ProblemSetProblem {
  string problem_set_id = 1;
  string problem_id = 2;
  double weight = 3;
  int64 first_step = 4;
  int64 last_step = 5;
}

// ProblemTypeAction defines parser/command and execution limits for a
// single problem type action.
message ProblemTypeAction {
  string command = 1;
  string parser = 2;
  int64 max_cpu = 3;
  int64 max_fd = 4;
  int64 max_file_size = 5;
  int64 max_memory = 6;
  int64 max_threads = 7;
}

// ProblemType defines one type of problem.
message ProblemType {
  string problem_type = 1;
  string container = 2;
  map<string, bytes> files = 3;
  map<string, ProblemTypeAction> actions = 4;
}

enum ProblemTypeFileOperation {
  PROBLEM_TYPE_FILE_OPERATION_UNSPECIFIED = 0;
  PROBLEM_TYPE_FILE_OPERATION_ADD = 1;
  PROBLEM_TYPE_FILE_OPERATION_UPDATE = 2;
  PROBLEM_TYPE_FILE_OPERATION_DELETE = 3;
}

message ProblemTypeFileChange {
  ProblemTypeFileOperation operation = 1;
  string path = 2;
  bytes content = 3;
}

enum ProblemTypeOperation {
  PROBLEM_TYPE_OPERATION_UNSPECIFIED = 0;
  PROBLEM_TYPE_OPERATION_CREATE = 1;
  PROBLEM_TYPE_OPERATION_DELETE = 2;
}

message ProblemTypeChange {
  ProblemTypeOperation operation = 1;
  string problem_type = 2;
  string container = 3;
}

enum ProblemTypeActionOperation {
  PROBLEM_TYPE_ACTION_OPERATION_UNSPECIFIED = 0;
  PROBLEM_TYPE_ACTION_OPERATION_ADD = 1;
  PROBLEM_TYPE_ACTION_OPERATION_UPDATE = 2;
  PROBLEM_TYPE_ACTION_OPERATION_DELETE = 3;
}

message ProblemTypeActionChange {
  ProblemTypeActionOperation operation = 1;
  string problem_type = 2;
  string action = 3;
  ProblemTypeAction action_definition = 4;
}

// ReportCardResult Outcomes:
// passed, failed, error, skipped
message ReportCardResult {
  string name = 1;
  string outcome = 2;
  string details = 3;
  string context = 4;
}

// ReportCard gives the results of a graded run
message ReportCard {
  bool passed = 1;
  string note = 2;
  google.protobuf.Duration duration = 3;
  repeated ReportCardResult results = 4;
}

// EventMessage follows one of these forms:
// exec ExecCommand, exit ExitStatus, stdin StreamData, stdout StreamData,
// stderr StreamData, stdinclosed, error Error, reportcard ReportCard, files Files
message EventMessage {
  google.protobuf.Timestamp time = 1;
  string event = 2;
  repeated string exec_command = 3;
  int32 exit_status = 4;
  bytes stream_data = 5;
  string error = 6;
  ReportCard report_card = 7;
  map<string, bytes> files = 8;
}

// Commit defines an attempt at solving one step of a Problem.
message Commit {
  int64 id = 1;
  AssignmentKey assignment = 2;
  string problem_id = 3;
  int64 step = 4;
  string action = 5;
  string note = 6;
  map<string, bytes> files = 7;
  repeated EventMessage transcript = 8;
  ReportCard report_card = 9;
  double score = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// RuntimeLimits carries container limits for one runtime action.
message RuntimeLimits {
  int64 max_cpu = 1;
  int64 max_fd = 2;
  int64 max_file_size = 3;
  int64 max_memory = 4;
  int64 max_threads = 5;
}

// RuntimeBundle is the complete signed execution request consumed by daycare.
message RuntimeBundle {
  string hostname = 1;
  string user_id = 2;
  AssignmentKey assignment = 3;
  string problem_id = 4;
  string problem_note = 5;
  repeated string problem_options = 6;
  int64 step_number = 7;
  int64 total_steps = 8;
  string action = 9;
  string container = 10;
  string command = 11;
  string parser = 12;
  RuntimeLimits limits = 13;
  map<string, bytes> files = 14;
  Commit commit = 15;
  map<string, bytes> starter_files = 16;
}

// SignedRuntimeBundle carries protobuf-encoded runtime bundle bytes plus an HMAC
// signature. Clients may decode the bytes for inspection, but must forward the
// encoded bytes unchanged to preserve the signature.
message SignedRuntimeBundle {
  bytes bundle = 1;
  string signature = 2;
}

// DaycareRequest represents a request for the daycare service.
message DaycareRequest {
  SignedRuntimeBundle bundle = 1;
  repeated string args = 2;
}

// DaycareResponse represents a response from the daycare service.
message DaycareResponse {
  oneof response {
    EventMessage event = 1;
    string error = 2;
    SignedRuntimeBundle bundle = 3;
  }
}

// GradingCommit represents one commit together with the grading context daycare needs.
message GradingCommit {
  string hostname = 1;
  string user_id = 2;
  Commit commit = 3;
}

enum SaveMode {
  SAVE_MODE_UNSPECIFIED = 0;
  SAVE_MODE_CREATE = 1;
  SAVE_MODE_UPDATE = 2;
}

message AuthorFile {
  string path = 1;
  bytes content = 2;
}

message AuthorProblemStepDraft {
  int64 step_number = 1;
  string problem_type = 2;
  string note = 3;
  double weight = 4;
  repeated AuthorFile files = 5;
  repeated AuthorFile starter_files = 6;
}

message AuthorProblemDraft {
  string problem_id = 1;
  string problem_note = 2;
  repeated string problem_tags = 3;
  repeated string problem_options = 4;
  repeated AuthorProblemStepDraft steps = 5;
}

// ProblemBundle represents a bundle of problem data.
message ProblemBundle {
  Problem problem = 1;
  repeated ProblemStep problem_steps = 2;
  map<string, ProblemType> problem_types = 3;
  string hostname = 4;
  string user_id = 5;
  repeated Commit solution_commits = 6;
  repeated SignedRuntimeBundle signed_validation_bundles = 7;
}

// ProblemSetBundle represents a bundle of problem set data.
message ProblemSetBundle {
  ProblemSet problem_set = 1;
  repeated ProblemSetProblem problem_set_problems = 2;
}

// Request for Hello
message HelloRequest {
  string token = 1;
}

// Response for Hello
message HelloResponse {
  string session_key = 1;
  string user_id = 2;
  string user_name = 3;
  string user_login = 4;
  bool is_author = 5;
  bool is_instructor = 6;
  bool is_admin = 7;
  Version version = 8;
}

// Request for ListAssignments
message ListAssignmentsRequest {
  repeated string search = 1;
  bool include_student_context = 2;
}

// AssignmentListItem returns assignment list data shaped for list/student commands.
message AssignmentListProblem {
  string problem_id = 1;
  int64 first_step = 2;
  int64 last_step = 3;
}

enum AssignmentDownloadStatus {
  ASSIGNMENT_DOWNLOAD_STATUS_AVAILABLE = 0;
  ASSIGNMENT_DOWNLOAD_STATUS_NOT_OPEN = 1;
  ASSIGNMENT_DOWNLOAD_STATUS_PREREQ_NOT_READY = 2;
}

message AssignmentListItem {
  AssignmentKey assignment = 1;
  string problem_set_note = 2;
  google.protobuf.Timestamp unlock_at = 3;
  google.protobuf.Timestamp due_at = 4;
  google.protobuf.Timestamp lock_at = 5;
  string course_name = 6;
  string user_name = 7;
  string user_login = 8;
  repeated AssignmentListProblem problems = 9;
  AssignmentDownloadStatus download_status = 10;
}

// Response for ListAssignments
message ListAssignmentsResponse {
  repeated AssignmentListItem items = 1;
}

// Request for SearchProblemCatalog
message SearchProblemCatalogRequest {
  repeated string search = 1;
}

// ProblemCatalogStep summarizes one step for catalog display.
message ProblemCatalogStep {
  int64 step_number = 1;
  string step_note = 2;
  int64 step_weight = 3;
}

// ProblemCatalogProblem summarizes one problem and its steps for a problem set.
message ProblemCatalogProblem {
  string problem_id = 1;
  string problem_note = 2;
  int64 problem_weight = 3;
  repeated ProblemCatalogStep steps = 4;
}

// ProblemCatalogSet summarizes one problem set for search results.
message ProblemCatalogSet {
  string problem_set_id = 1;
  string problem_set_note = 2;
  repeated string problem_set_tags = 3;
  repeated ProblemCatalogProblem problems = 4;
}

// Response for SearchProblemCatalog
message SearchProblemCatalogResponse {
  repeated ProblemCatalogSet problem_sets = 1;
}

// Request for GetProblemTypes
message GetProblemTypesRequest {
}

// Response for GetProblemTypes
message GetProblemTypesResponse {
  repeated ProblemType problem_types = 1;
}

// Request for GetProblemType
message GetProblemTypeRequest {
  string problem_type = 1;
}

// Response for GetProblemType
message GetProblemTypeResponse {
  ProblemType problem_type = 1;
}

// Request for SaveProblemTypeFiles
message SaveProblemTypeFilesRequest {
  string problem_type = 1;
  repeated ProblemTypeFileChange changes = 2;
}

// Response for SaveProblemTypeFiles
message SaveProblemTypeFilesResponse {
  ProblemType problem_type = 1;
}

// Request for SaveProblemType
message SaveProblemTypeRequest {
  repeated ProblemTypeChange problem_type_changes = 1;
  repeated ProblemTypeActionChange action_changes = 2;
}

// Response for SaveProblemType
message SaveProblemTypeResponse {
  repeated ProblemType problem_types = 1;
}

// Request for GetAssignment
message GetAssignmentRequest {
  AssignmentKey assignment = 1;
}

// AssignmentProblemProgress reports one problem's progress in the assignment.
message AssignmentProblemProgress {
  string problem_id = 1;
  string problem_note = 2;
  int64 current_step_number = 3;
  int64 first_step_number = 4;
  int64 last_step_number = 5;
}

// Response for GetAssignment
message GetAssignmentResponse {
  AssignmentKey assignment = 1;
  string problem_set_note = 2;
  string course_name = 3;
  repeated AssignmentProblemProgress problems = 4;
  AssignmentDownloadStatus download_status = 5;
}

enum WorkspaceFileState {
  WORKSPACE_FILE_STATE_UNSPECIFIED = 0;
  WORKSPACE_FILE_STATE_CURRENT = 1;
  WORKSPACE_FILE_STATE_STEP_START = 2;
}

// Request for GetWorkspace
message GetWorkspaceRequest {
  AssignmentKey assignment = 1;
  string problem_id = 2;
  int64 step_number = 3; // 0 means use the student's current step for this problem.
  WorkspaceFileState file_state = 4;
  bool include_contents = 5;
  bool include_solution_files = 6;
}

// Response for GetWorkspace
message GetWorkspaceResponse {
  AssignmentKey assignment = 1;
  string problem_id = 2;
  string problem_note = 3;
  int64 step_number = 4;
  string problem_type = 5;
  string step_note = 6;
  double step_weight = 7;
  repeated string actions = 8;
  map<string, bytes> system_owned_files = 9;
  map<string, bytes> student_owned_files = 10;
  map<string, bytes> solution_files = 11;
  int64 first_step_number = 12;
  int64 last_step_number = 13;
}

// Request for PrepareProblem
message PrepareProblemRequest {
  AuthorProblemDraft draft = 1;
  string action = 2;
}

// Response for PrepareProblem
message PrepareProblemResponse {
  ProblemBundle bundle = 1;
}

// Request for SaveProblem
message SaveProblemRequest {
  SaveMode mode = 1;
  ProblemBundle bundle = 2;
}

// Response for SaveProblem
message SaveProblemResponse {
  ProblemBundle bundle = 1;
}

// Request for SaveProblemSet
message SaveProblemSetRequest {
  SaveMode mode = 1;
  ProblemSetBundle bundle = 2;
}

// Response for SaveProblemSet
message SaveProblemSetResponse {
  ProblemSetBundle bundle = 1;
}

enum CommitSaveStatus {
  COMMIT_SAVE_STATUS_SAVED = 0;
  COMMIT_SAVE_STATUS_NOT_SAVED_LOCKED = 1;
  COMMIT_SAVE_STATUS_NOT_SAVED_NOT_OWNER = 2;
}

// Request for SaveWorkspaceCommit
message SaveWorkspaceCommitRequest {
  Commit commit = 1;
}

// Response for SaveWorkspaceCommit
message SaveWorkspaceCommitResponse {
  CommitSaveStatus save_status = 1;
}

// Request for SaveUngradedCommit
message SaveUngradedCommitRequest {
  GradingCommit commit = 1;
}

// Response for SaveUngradedCommit
message SaveUngradedCommitResponse {
  SignedRuntimeBundle bundle = 1;
  CommitSaveStatus save_status = 2;
}

// Request for SaveGradedCommit
message SaveGradedCommitRequest {
  SignedRuntimeBundle bundle = 1;
}

// Response for SaveGradedCommit
message SaveGradedCommitResponse {
  CommitSaveStatus save_status = 1;
}

// CodeGrinderService provides CodeGrinder operations
service CodeGrinderService {
  // Hello performs session validation/exchange and returns server info
  rpc Hello(HelloRequest) returns (HelloResponse);
  // ListAssignments retrieves assignment-focused list rows for list/student flows.
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
  // SearchProblemCatalog retrieves problem sets with nested problem and step summaries.
  rpc SearchProblemCatalog(SearchProblemCatalogRequest) returns (SearchProblemCatalogResponse);
  // GetProblemTypes retrieves all problem types
  rpc GetProblemTypes(GetProblemTypesRequest) returns (GetProblemTypesResponse);
  // GetProblemType retrieves a specific problem type
  rpc GetProblemType(GetProblemTypeRequest) returns (GetProblemTypeResponse);
  // SaveProblemTypeFiles applies admin changes to canonical problem type files.
  rpc SaveProblemTypeFiles(SaveProblemTypeFilesRequest) returns (SaveProblemTypeFilesResponse);
  // SaveProblemType applies admin changes to problem type metadata and actions.
  rpc SaveProblemType(SaveProblemTypeRequest) returns (SaveProblemTypeResponse);
  // GetAssignment retrieves assignment metadata and per-problem step progress.
  rpc GetAssignment(GetAssignmentRequest) returns (GetAssignmentResponse);
  // GetWorkspace retrieves canonical local workspace context for one assignment step.
  rpc GetWorkspace(GetWorkspaceRequest) returns (GetWorkspaceResponse);
  // PrepareProblem validates author source material and signs daycare bundles.
  rpc PrepareProblem(PrepareProblemRequest) returns (PrepareProblemResponse);
  // SaveProblem persists a prepared author problem bundle.
  rpc SaveProblem(SaveProblemRequest) returns (SaveProblemResponse);
  // SaveProblemSet persists an authored problem set bundle.
  rpc SaveProblemSet(SaveProblemSetRequest) returns (SaveProblemSetResponse);
  // SaveWorkspaceCommit persists current student-owned workspace files.
  rpc SaveWorkspaceCommit(SaveWorkspaceCommitRequest) returns (SaveWorkspaceCommitResponse);
  // SaveUngradedCommit handles an ungraded commit before daycare processing.
  rpc SaveUngradedCommit(SaveUngradedCommitRequest) returns (SaveUngradedCommitResponse);
  // SaveGradedCommit handles a graded commit returned by daycare.
  rpc SaveGradedCommit(SaveGradedCommitRequest) returns (SaveGradedCommitResponse);
  // Daycare handles streaming daycare requests
  rpc Daycare(DaycareRequest) returns (stream DaycareResponse);
}
